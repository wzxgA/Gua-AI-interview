spring:
  application:
    name: aims-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  ai:
    model:
      # Spring AI 自动装配关闭：ChatModel/EmbeddingModel 由 interview-ai 按档位手动装配
      chat: none
      embedding: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        logic-delete-field: deleted
        logic-delete-value: '1'
        logic-not-delete-value: '0'
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: aims-evaluation
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Phase 6: 新增 prometheus（P7 Prometheus 接入时启用抓取）
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Phase 6: 为节点耗时与模型延迟启用直方图（P50/P95/P99）
        aims.graph.node.duration: true
        aims.llm.latency: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

aims:
  ai:
    default-tier: ${AIMS_DEFAULT_TIER:STANDARD}
    # 配置中心化（v1.2 D 方案）：DB 覆盖层的 API Key 加密密钥（base64 32 字节）
    # 未配置时退化为由 AIMS_JWT_SECRET 派生；生产环境务必配置 AIMS_CONFIG_ENCRYPT_KEY
    config-store:
      encrypt-key: ${AIMS_CONFIG_ENCRYPT_KEY:}
    providers:
      # 通义千问（DashScope OpenAI 兼容模式）
      dashscope:
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${DASHSCOPE_API_KEY}
      deepseek:
        # Spring AI 自动拼接 /v1/chat/completions，默认值不要带 /v1（否则请求 /v1/v1/... 404）
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY}
    tiers:
      # 档位 -> 提供商/模型/参数映射；fallback 形如 provider:model
      FLAGSHIP:
        provider: ${AIMS_FLAGSHIP_PROVIDER:dashscope}
        model: ${AIMS_FLAGSHIP_MODEL:qwen-max}
        temperature: ${AIMS_FLAGSHIP_TEMPERATURE:0.7}
        max-tokens: ${AIMS_FLAGSHIP_MAX_TOKENS:2048}
        # DeepSeek 推理模型思考模式：enabled/disabled（或 true/false），留空走模型默认
        thinking: ${AIMS_FLAGSHIP_THINKING:}
        # 思考强度：low/high/max（仅思考开启时生效）
        reasoning-effort: ${AIMS_FLAGSHIP_REASONING_EFFORT:}
        fallback: deepseek:deepseek-chat
      STANDARD:
        provider: ${AIMS_STANDARD_PROVIDER:deepseek}
        model: ${AIMS_STANDARD_MODEL:deepseek-chat}
        temperature: ${AIMS_STANDARD_TEMPERATURE:0.2}
        max-tokens: ${AIMS_STANDARD_MAX_TOKENS:2048}
        thinking: ${AIMS_STANDARD_THINKING:}
        reasoning-effort: ${AIMS_STANDARD_REASONING_EFFORT:}
      ECONOMY:
        provider: ${AIMS_ECONOMY_PROVIDER:dashscope}
        model: ${AIMS_ECONOMY_MODEL:qwen-turbo}
        temperature: ${AIMS_ECONOMY_TEMPERATURE:0.3}
        max-tokens: ${AIMS_ECONOMY_MAX_TOKENS:1024}
        thinking: ${AIMS_ECONOMY_THINKING:}
        reasoning-effort: ${AIMS_ECONOMY_REASONING_EFFORT:}
      EMBEDDING:
        provider: ${AIMS_EMBEDDING_PROVIDER:dashscope}
        model: ${AIMS_EMBEDDING_MODEL:text-embedding-v4}
        dimensions: ${AIMS_EMBEDDING_DIMENSIONS:2048}
    # 价目表：元/千 tokens（成本估算用，可按需调整）
    pricing:
      qwen-max:
        input: 0.04
        output: 0.12
      qwen-turbo:
        input: 0.0003
        output: 0.0006
      deepseek-chat:
        input: 0.002
        output: 0.008
    retry:
      max-attempts: 2
      initial-backoff: 500ms
  security:
    jwt:
      secret: ${AIMS_JWT_SECRET}
      access-ttl: ${AIMS_JWT_ACCESS_TTL:7200}
      refresh-ttl: ${AIMS_JWT_REFRESH_TTL:604800}
  tts:
    enabled: ${AIMS_TTS_ENABLED:false}
    provider: ${AIMS_TTS_PROVIDER:volc}
    api-key: ${VOLC_TTS_API_KEY:}
    resource-id: ${VOLC_TTS_RESOURCE_ID:seed-tts-2.0}
    base-url: ${VOLC_TTS_BASE_URL:https://openspeech.bytedance.com/api/v3/plan/tts/unidirectional}
    default-speaker: ${VOLC_TTS_SPEAKER:zh_male_m191_uranus_bigtts}
    format: mp3
    sample-rate: 24000
    speech-rate: 0
    persona-voice-link: true
  log:
    # LLM 调用日志的 prompt 摘要截断长度（字符）；排查需要时可临时调大（AIMS_LOG_PROMPT_MAX_CHARS）
    prompt-max-chars: ${AIMS_LOG_PROMPT_MAX_CHARS:200}

rag:
  # 题库 RAG 检索缓存（均可关闭，Redis 异常自动降级直查）
  cache:
    # 检索结果缓存（同 query+过滤，TTL 60s）
    result-enabled: ${AIMS_RAG_RESULT_CACHE_ENABLED:true}
    # 查询向量缓存（同 query，TTL 30min，近似 JD 更新粒度）
    embedding-enabled: ${AIMS_RAG_EMBEDDING_CACHE_ENABLED:true}

logging:
  # Phase 6: 注入 MDC 上下文（sessionId/node/round），统一面试流程日志格式
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{sessionId:-}] [%X{node:-}/%X{round:-}] %-5level %logger{36} - %msg%n"
  level:
    org.apache.kafka: WARN
