spring:
  application:
    name: aims-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  ai:
    model:
      # Spring AI 自动装配关闭：ChatModel/EmbeddingModel 由 interview-ai 按档位手动装配
      chat: none
      embedding: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        logic-delete-field: deleted
        logic-delete-value: '1'
        logic-not-delete-value: '0'
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: aims-evaluation
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

aims:
  ai:
    default-tier: ${AIMS_DEFAULT_TIER:STANDARD}
    providers:
      # 通义千问（DashScope OpenAI 兼容模式）
      dashscope:
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${DASHSCOPE_API_KEY}
      deepseek:
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        api-key: ${DEEPSEEK_API_KEY}
    tiers:
      # 档位 -> 提供商/模型/参数映射；fallback 形如 provider:model
      FLAGSHIP:
        provider: ${AIMS_FLAGSHIP_PROVIDER:dashscope}
        model: ${AIMS_FLAGSHIP_MODEL:qwen-max}
        temperature: 0.7
        max-tokens: 2048
        fallback: deepseek:deepseek-chat
      STANDARD:
        provider: ${AIMS_STANDARD_PROVIDER:deepseek}
        model: ${AIMS_STANDARD_MODEL:deepseek-chat}
        temperature: 0.2
        max-tokens: 2048
      ECONOMY:
        provider: ${AIMS_ECONOMY_PROVIDER:dashscope}
        model: ${AIMS_ECONOMY_MODEL:qwen-turbo}
        temperature: 0.3
        max-tokens: 1024
      EMBEDDING:
        provider: ${AIMS_EMBEDDING_PROVIDER:dashscope}
        model: ${AIMS_EMBEDDING_MODEL:text-embedding-v4}
        dimensions: ${AIMS_EMBEDDING_DIMENSIONS:2048}
    # 价目表：元/千 tokens（成本估算用，可按需调整）
    pricing:
      qwen-max:
        input: 0.04
        output: 0.12
      qwen-turbo:
        input: 0.0003
        output: 0.0006
      deepseek-chat:
        input: 0.002
        output: 0.008
    retry:
      max-attempts: 2
      initial-backoff: 500ms

logging:
  level:
    org.springframework.web.client: DEBUG
    org.springframework.ai.openai.api: DEBUG
